/* ---------------- 3D hero (lazy, home only) ---------------- */
let heroStop = null;
async function startHero(canvas) {
  const THREE = await import('three');

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(55, 1, .1, 100); cam.position.z = 9;
  scene.add(new THREE.AmbientLight(0xffffff, .7));
  const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(5, 6, 5); scene.add(key);
  const fill = new THREE.PointLight(0x7ed957, 2, 30); fill.position.set(-6, -4, 4); scene.add(fill);

    const m = new THREE.Mesh(geos[i % geos.length], new THREE.MeshPhysicalMaterial({ color: pal[i % 5], roughness: .35, clearcoat: .6 }));
    m.position.set((Math.random() - .5) * 18, (Math.random() - .5) * 12, (Math.random() - .5) * 6 - 2);
    m.rotation.set(Math.random() * 3, Math.random() * 3, 0); m.scale.setScalar(.5 + Math.random() * .8);
    m.userData = { rs: (Math.random() - .5) * .01, fs: .4 + Math.random() * .8, off: Math.random() * 6.28, y0: m.position.y };
    scene.add(m); shapes.push(m);
  }
  const mouse = { x: 0, y: 0 };
  const onMove = e => { mouse.x = (e.clientX / innerWidth - .5) * 2; mouse.y = (e.clientY / innerHeight - .5) * 2; };
  const resize = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };

    const t = clock.getElapsedTime();
    shapes.forEach(m => { m.rotation.x += m.userData.rs * 2; m.rotation.y += m.userData.rs * 3; m.position.y = m.userData.y0 + Math.sin(t * m.userData.fs + m.userData.off) * .6; });

}

const hav = (a, b) => { const R = 6371, dLat = (b[0] - a[0]) * Math.PI / 180, dLon = (b[1] - a[1]) * Math.PI / 180, x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
function mockListings(c) {
  return FOODS.map((f, i) => { const pos = [c[0] + (Math.random() - .5) * .03, c[1] + (Math.random() - .5) * .03]; return { id: i + 1, name: f[0], diet: f[1], portions: f[2], img: f[3], alt: f[4], donor: DONORS[i], pos, km: hav(c, pos), cooked: 20 + Math.floor(Math.random() * 100), expires: Date.now() + (40 + Math.random() * 120) * 60000 }; });
}
const mins = ms => Math.max(0, Math.round(ms / 60000));

  '/find': {
    seo: { title: 'Find leftover food near you – MessSaver', desc: 'Live map of surplus meals shared by neighbours, canteens and restaurants near you. Filter by diet, see freshness, request a pickup and track it in real time.' },
    crumbs: [{ name: 'Home', path: '/' }, { name: 'Find food', path: '/find' }],
    html: () => `<div class="wrap finder">
  <div class="panel" id="panel">
    <div class="panel-h"><h1>Food near you</h1><span class="muted" id="count"></span></div>
    <div class="filters" role="group" aria-label="Filter by diet"><button class="chip on" data-f="all">All</button><button class="chip" data-f="veg">Veg</button><button class="chip" data-f="nonveg">Non-veg</button><button class="chip" data-f="near">Under 1 km</button></div>
    <div class="list" id="list"><p class="muted" style="padding:1.2rem">Locating you…</p></div>
  </div>
  <div id="map" role="region" aria-label="Map of nearby food listings"></div>
</div>`,
    mount: async () => {
      const L = await loadLeaflet();
      const me = await new Promise(r => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => r([p.coords.latitude, p.coords.longitude]), () => r([17.4435, 78.3772]), { timeout: 5000 }) : r([17.4435, 78.3772]));
      const map = L.map('map', { zoomControl: false }).setView(me, 15);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap © CARTO', maxZoom: 19 }).addTo(map);
      const icon = (cls, emoji) => L.divIcon({ className: '', html: `<div class="pin ${cls}"><span>${emoji}</span></div>`, iconSize: [36, 36], iconAnchor: [18, 36] });
      L.marker(me, { icon: icon('me', '🧍'), title: 'You are here' }).addTo(map).bindPopup('You are here');
      L.circle(me, { radius: 1000, color: '#7ed957', weight: 1, fillOpacity: .04 }).addTo(map);
      const data = mockListings(me).sort((a, b) => a.km - b.km);
      const markers = {}; let filter = 'all', sel = null;
      data.forEach(l => { markers[l.id] = L.marker(l.pos, { icon: icon('', l.diet === 'veg' ? '🥗' : '🍗'), title: l.name }).addTo(map).bindPopup(`<b>${esc(l.name)}</b><br>${esc(l.donor)}<br>${l.portions} portions · ${l.km.toFixed(1)} km`).on('click', () => select(l.id)); });
      const list = $('#list');
      function draw() {
        const rows = data.filter(l => filter === 'all' || (filter === 'near' ? l.km < 1 : l.diet === filter));
        $('#count').textContent = `${rows.length} listings`;
        list.innerHTML = rows.map(l => `<article class="item ${sel === l.id ? 'sel' : ''}" data-id="${l.id}" tabindex="0">
  <img src="${l.img}" alt="${esc(l.alt)}" loading="lazy" width="64" height="64">
  <div><h3>${esc(l.name)} <span class="tag ${l.diet}">${l.diet === 'veg' ? 'VEG' : 'NON-VEG'}</span></h3>
  <div class="meta"><span>${esc(l.donor)}</span><span>${l.portions} portions</span><span>${l.km.toFixed(1)} km</span><span class="fresh">⏳ ${mins(l.expires - Date.now())} min left</span></div></div></article>`).join('') || '<p class="muted" style="padding:1.2rem">Nothing matches. Try another filter.</p>';
      }
      function select(id) { sel = id; const l = data.find(x => x.id === id); map.flyTo(l.pos, 16, { duration: .8 }); markers[id].openPopup(); draw(); showDetail(l); }
      function showDetail(l) {
        list.innerHTML = `<div class="track">
  <button class="chip" id="back">← Back to list</button>
  <img src="${l.img.replace('w=200', 'w=600')}" alt="${esc(l.alt)}" style="width:100%;height:160px;object-fit:cover;border-radius:1rem;margin:1rem 0">
  <h2 style="font-size:1.3rem">${esc(l.name)} <span class="tag ${l.diet}">${l.diet === 'veg' ? 'VEG' : 'NON-VEG'}</span></h2>
  <p class="muted">${esc(l.donor)} · ${l.km.toFixed(1)} km · cooked ${l.cooked} min ago</p>
  <p class="fresh" style="margin:.6rem 0">⏳ Fresh for ${mins(l.expires - Date.now())} more minutes</p>
  <p class="muted" style="font-size:.9rem">Allergens: ${l.diet === 'veg' ? 'dairy, gluten' : 'none declared'}. Packed in reusable containers.</p>
  <button class="btn btn-p full" id="req">Request pickup</button></div>`;
        $('#back').onclick = () => { sel = null; draw(); };
        $('#req').onclick = () => { if (!session.get()) { toast('Log in to request a pickup'); location.hash = '#/login?next=/find'; return; } track(l); };
      }
      let riderMarker, line, timer;
      function track(l) {
        const code = String(Math.floor(1000 + Math.random() * 9000));
        const steps = ['Requested', 'Accepted', 'On the way', 'Handover'];
        let stage = 0, prog = 0;
        line?.remove(); riderMarker?.remove();
        line = L.polyline([me, l.pos], { color: '#ffb347', weight: 4, dashArray: '8 10' }).addTo(map);
        riderMarker = L.marker(me, { icon: icon('rider', '🛵'), title: 'You, en route' }).addTo(map);
        map.fitBounds(line.getBounds(), { padding: [60, 60] });
        const render = () => {
          const eta = Math.max(0, Math.round((1 - prog) * l.km * 4));
          list.innerHTML = `<div class="track">
  <div class="row"><h2 style="font-size:1.2rem">Pickup: ${esc(l.name)}</h2><span class="tag veg">${steps[stage]}</span></div>
  <div class="steps">${steps.map((s, i) => `<div class="step ${i < stage ? 'done' : i === stage ? 'now' : ''}" title="${s}"></div>`).join('')}</div>
  <div class="row"><div><div class="muted" style="font-size:.85rem">Arriving in</div><div class="eta">${eta} min</div></div><div style="text-align:right"><div class="muted" style="font-size:.85rem">Pickup from</div><b>${esc(l.donor)}</b></div></div>
  <label class="toggle" style="margin:1rem 0"><input type="checkbox" id="share" checked style="width:auto"> Share my live location with the donor</label>
  <div class="muted" style="font-size:.85rem">Show this code at handover</div><div class="code" aria-label="Handover code">${code}</div>
  <div class="row"><a class="btn btn-g btn-sm" href="tel:+910000000000">📞 Call donor</a><a class="btn btn-g btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${l.pos[0]},${l.pos[1]}">🧭 Open in Maps</a><button class="btn btn-g btn-sm" id="cancel">Cancel</button></div></div>`;
          $('#cancel').onclick = () => { clearInterval(timer); line.remove(); riderMarker.remove(); toast('Pickup cancelled'); sel = null; draw(); };
        };
        render();
        timer = setInterval(() => {
          prog = Math.min(1, prog + .012);
          riderMarker.setLatLng([me[0] + (l.pos[0] - me[0]) * prog, me[1] + (l.pos[1] - me[1]) * prog]);
          const ns = prog < .1 ? 0 : prog < .25 ? 1 : prog < 1 ? 2 : 3;
          if (ns !== stage) { stage = ns; toast(steps[stage]); }
          render();
          if (prog >= 1) { clearInterval(timer); toast('Handover complete. +50 Karma 🌱'); }
        }, 700);
      }
      list.addEventListener('click', e => { const it = e.target.closest('.item'); if (it) select(+it.dataset.id); });
      list.addEventListener('keydown', e => { const it = e.target.closest('.item'); if (it && e.key === 'Enter') select(+it.dataset.id); });
      $('#panel').querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => { $('#panel .chip.on')?.classList.remove('on'); b.classList.add('on'); filter = b.dataset.f; sel = null; draw(); });
      draw();
      this._cleanup = () => { clearInterval(timer); map.remove(); };
    }
  },

/* ---------------- router ---------------- */
let cleanup = null;
function route() {
  const path = (location.hash.slice(1) || '/').split('?')[0];
  const v = views[path] || views['404'];
  const is404 = !views[path];
  cleanup?.(); cleanup = null; heroStop?.();
  setSEO({ ...v.seo, path: is404 ? path : path });
  let robots = $('meta[name="robots"]'); if (is404) { if (!robots) { robots = document.createElement('meta'); robots.name = 'robots'; document.head.appendChild(robots); } robots.content = 'noindex'; } else robots?.remove();
  app.innerHTML = (v.crumbs ? crumbs(v.crumbs) : '') + v.html();
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + path));
  $('#links').classList.remove('open');
  window.scrollTo({ top: 0 });
  if (v.mount) { const ctx = {}; v.mount.call(ctx); cleanup = () => ctx._cleanup?.(); }
}
addEventListener('hashchange', route);
$('#burger').onclick = () => { const o = $('#links').classList.toggle('open'); $('#burger').setAttribute('aria-expanded', o); };
renderAuthSlot(); route();
</script>
